[project]
name = "product-inventory"
version = "0.1.0"
description = "Production-ready FastAPI REST API for a Product Inventory system"
authors = [{ name = "Amar", email = "amarnathk@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi (>=0.136.3,<0.137.0)", "uvicorn[standard] (>=0.48.0,<0.49.0)"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.13"
pytest = "^8.3"
httpx = "^0.28"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
